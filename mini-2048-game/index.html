<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 小游戏</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div class="game-container">
    <div class="game-header">
      <h1>2048</h1>
      <div class="score-container">
        <div class="score-box">
          <span class="score-label">分数</span>
          <span class="score-value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">最高分</span>
          <span class="score-value" id="best-score">0</span>
        </div>
      </div>
    </div>
    <div class="game-controls">
      <p class="game-intro">使用 <strong>方向键</strong> 移动方块，相同数字合并！</p>
      <button class="restart-btn" id="restart-btn">重新开始</button>
    </div>
    <div class="game-board" id="game-board">
      <div class="grid-container" id="grid-container"></div>
      <div class="tile-container" id="tile-container"></div>
    </div>
    <div class="game-message" id="game-message">
      <div class="message-content">
        <p class="message-text" id="message-text"></p>
        <button class="message-btn" id="message-btn">继续游戏</button>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
