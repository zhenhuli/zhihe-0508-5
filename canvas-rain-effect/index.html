<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas 雨滴特效</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <canvas id="rainCanvas"></canvas>
        
        <div class="controls-panel">
            <h2>🌧️ 雨滴特效控制</h2>
            
            <div class="control-group">
                <label>雨滴密度: <span id="densityValue">100</span></label>
                <input type="range" id="density" min="20" max="300" value="100">
            </div>
            
            <div class="control-group">
                <label>下落速度: <span id="speedValue">8</span></label>
                <input type="range" id="speed" min="2" max="20" value="8">
            </div>
            
            <div class="control-group">
                <label>透明度: <span id="opacityValue">0.6</span></label>
                <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.6">
            </div>
            
            <div class="control-group">
                <button id="themeToggle" class="theme-btn">🌙 切换黑夜模式</button>
            </div>
        </div>
    </div>
    
    <script type="module" src="app.js"></script>
</body>
</html>
