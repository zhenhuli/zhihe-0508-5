<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表单数据</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between">
        <div>
          <a href="/" class="text-blue-600 hover:text-blue-800 text-sm mb-2 inline-block">← 返回首页</a>
          <h1 id="page-title" class="text-2xl font-bold text-gray-900">表单数据</h1>
        </div>
        <div class="flex space-x-3">
          <button onclick="exportCSV()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors">
            导出 CSV
          </button>
          <button onclick="window.open('/form/' + shareCode, '_blank')" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
            打开表单
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
    <div id="loading" class="text-center py-12">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
      <p class="mt-4 text-gray-600">加载数据中...</p>
    </div>

    <div id="stats-container" class="hidden mb-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white rounded-lg shadow p-6">
          <p class="text-gray-500 text-sm">总提交数</p>
          <p id="total-submissions" class="text-3xl font-bold text-gray-900">0</p>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
          <p class="text-gray-500 text-sm">表单字段数</p>
          <p id="total-fields" class="text-3xl font-bold text-gray-900">0</p>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
          <p class="text-gray-500 text-sm">分享码</p>
          <p id="share-code" class="text-3xl font-bold text-blue-600">-</p>
        </div>
      </div>
    </div>

    <div id="data-container" class="hidden">
      <div class="bg-white rounded-lg shadow overflow-hidden">
        <div class="overflow-x-auto">
          <table id="submissions-table" class="min-w-full divide-y divide-gray-200">
            <thead id="table-header" class="bg-gray-50">
            </thead>
            <tbody id="table-body" class="bg-white divide-y divide-gray-200">
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="empty-state" class="hidden text-center py-16 bg-white rounded-lg shadow">
      <div class="text-6xl mb-4">📋</div>
      <h2 class="text-xl font-semibold text-gray-900 mb-2">暂无数据</h2>
      <p class="text-gray-600 mb-6">该表单还没有任何人提交</p>
      <button onclick="window.open('/form/' + shareCode, '_blank')" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
        打开表单填写
      </button>
    </div>

    <div id="not-found" class="hidden text-center py-16 bg-white rounded-lg shadow">
      <div class="text-6xl mb-4">❌</div>
      <h2 class="text-xl font-semibold text-gray-900 mb-2">表单不存在</h2>
      <p class="text-gray-600 mb-6">该表单可能已被删除</p>
      <a href="/" class="inline-block px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
        返回首页
      </a>
    </div>
  </main>

  <script src="/js/submissions.js"></script>
</body>
</html>
