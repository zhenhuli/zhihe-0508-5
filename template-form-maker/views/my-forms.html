<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的表单 - 表单模板生成器</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-4">
          <a href="/" class="text-2xl font-bold text-gray-900 hover:text-blue-600 transition-colors">
            📋 表单模板生成器
          </a>
        </div>
        <div class="flex space-x-4">
          <a href="/builder" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
            新建表单
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900 mb-2">我的表单</h1>
      <p class="text-gray-600">管理您创建的所有表单，查看数据和分享链接</p>
    </div>

    <div id="loading" class="text-center py-16">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
      <p class="mt-4 text-gray-600">加载中...</p>
    </div>

    <div id="form-list" class="hidden space-y-4"></div>

    <div id="empty-state" class="hidden text-center py-16 bg-white rounded-lg shadow">
      <div class="text-6xl mb-4">📋</div>
      <h2 class="text-2xl font-semibold text-gray-900 mb-2">暂无表单</h2>
      <p class="text-gray-600 mb-8">您还没有创建任何表单，点击下方按钮开始创建</p>
      <a href="/builder" class="inline-block px-8 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium">
        创建第一个表单
      </a>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadFormList();
    });

    async function loadFormList() {
      try {
        const response = await fetch('/api/forms');
        const forms = await response.json();
        
        document.getElementById('loading').classList.add('hidden');
        
        if (forms.length === 0) {
          document.getElementById('empty-state').classList.remove('hidden');
          return;
        }

        const listContainer = document.getElementById('form-list');
        listContainer.classList.remove('hidden');

        listContainer.innerHTML = forms.map(form => `
          <div class="bg-white rounded-lg shadow p-6 hover:shadow-lg transition-shadow">
            <div class="flex items-start justify-between">
              <div class="flex-1">
                <h3 class="text-xl font-semibold text-gray-900 mb-2">${form.title}</h3>
                ${form.description ? `<p class="text-gray-600 mb-4">${form.description}</p>` : ''}
                <div class="flex flex-wrap items-center gap-4 text-sm text-gray-500">
                  <span class="flex items-center">
                    <span class="mr-1">📝</span>
                    ${form.submission_count} 条提交
                  </span>
                  <span class="flex items-center">
                    <span class="mr-1">🕐</span>
                    ${new Date(form.created_at).toLocaleString()}
                  </span>
                  <span class="flex items-center">
                    <span class="mr-1">🔗</span>
                    分享码: ${form.share_code}
                  </span>
                </div>
              </div>
              <div class="flex flex-col space-y-3 ml-6">
                <button onclick="window.open('/form/${form.share_code}', '_blank')" 
                        class="px-5 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 transition-colors text-sm font-medium whitespace-nowrap">
                  打开表单
                </button>
                <button onclick="window.open('/submissions/${form.share_code}', '_blank')" 
                        class="px-5 py-2 bg-green-100 text-green-700 rounded-lg hover:bg-green-200 transition-colors text-sm font-medium whitespace-nowrap">
                  查看数据
                </button>
                <button onclick="copyFormLink('${form.share_code}')" 
                        class="px-5 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors text-sm font-medium whitespace-nowrap">
                  复制链接
                </button>
                <button onclick="deleteForm('${form.id}')" 
                        class="px-5 py-2 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 transition-colors text-sm font-medium whitespace-nowrap">
                  删除
                </button>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('loading').innerHTML = '<p class="text-red-500">加载失败，请刷新重试</p>';
      }
    }

    function copyFormLink(shareCode) {
      const url = `${window.location.origin}/form/${shareCode}`;
      const tempInput = document.createElement('input');
      tempInput.value = url;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);
      alert('链接已复制到剪贴板！');
    }

    async function deleteForm(formId) {
      if (!confirm('确定要删除此表单吗？所有提交数据也将被删除，此操作不可恢复。')) {
        return;
      }

      try {
        const response = await fetch(`/api/forms/${formId}`, { method: 'DELETE' });
        if (response.ok) {
          loadFormList();
        } else {
          alert('删除失败');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('删除失败');
      }
    }
  </script>
</body>
</html>
