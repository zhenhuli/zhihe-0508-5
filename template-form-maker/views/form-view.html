<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>填写表单</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-2xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
    <div class="bg-white rounded-lg shadow-lg p-8">
      <div id="loading" class="text-center py-12">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
        <p class="mt-4 text-gray-600">加载表单中...</p>
      </div>

      <div id="form-container" class="hidden">
        <h1 id="form-title" class="text-2xl font-bold text-gray-900 mb-2"></h1>
        <p id="form-description" class="text-gray-600 mb-8"></p>
        
        <form id="dynamic-form" class="space-y-6">
        </form>
      </div>

      <div id="not-found" class="hidden text-center py-12">
        <p class="text-gray-600 text-lg">表单不存在或已被删除</p>
        <a href="/" class="inline-block mt-4 px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
          返回首页
        </a>
      </div>

      <div id="success" class="hidden text-center py-12">
        <div class="text-6xl mb-4">✅</div>
        <h2 class="text-2xl font-bold text-green-600 mb-2">提交成功！</h2>
        <p class="text-gray-600">感谢您的填写</p>
        <button onclick="resetForm()" class="inline-block mt-6 px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
          再填一份
        </button>
      </div>
    </div>
  </div>

  <script src="/js/form-view.js"></script>
</body>
</html>
