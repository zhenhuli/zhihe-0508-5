<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>九宫格拼图游戏</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>九宫格拼图游戏</h1>
        <div class="stats">
          <div class="stat-item">
            <span>时间</span>
            <span id="timer">00:00</span>
          </div>
          <div class="stat-item">
            <span>步数</span>
            <span id="moves">0</span>
          </div>
          <div class="stat-item">
            <span>难度</span>
            <span id="difficulty">3×3</span>
          </div>
        </div>
      </header>
      
      <main>
        <div class="game-container">
          <div class="preset-section">
            <h3>预设图片</h3>
            <div class="preset-grid" id="presetGrid"></div>
          </div>
          
          <div class="controls">
            <div class="control-group">
              <label for="imageUpload">自定义图片：</label>
              <input type="file" id="imageUpload" accept="image/*" />
            </div>
            <div class="control-group">
              <label for="difficultySelect">难度选择：</label>
              <select id="difficultySelect">
                <option value="2">2×2 (简单)</option>
                <option value="3" selected>3×3 (标准)</option>
                <option value="4">4×4 (中等)</option>
                <option value="5">5×5 (困难)</option>
              </select>
            </div>
            <div class="button-group">
              <button id="startBtn">开始游戏</button>
              <button id="resetBtn">重置</button>
            </div>
          </div>
          
          <div class="game-area">
            <div class="puzzle-container">
              <div id="puzzleGrid" class="grid"></div>
              <div id="placeholder" class="placeholder">
                <p>上传图片并点击开始游戏</p>
              </div>
            </div>
            <div class="preview">
              <h3>原图预览</h3>
              <div class="preview-container">
                <img id="previewImage" src="" alt="原图预览" />
                <div id="placeholderPreview" class="placeholder">
                  <p>暂无图片</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    
    <div id="winModal" class="modal hidden">
      <div class="modal-content">
        <h2>🎉 恭喜通关！</h2>
        <div class="win-stats">
          <p>用时：<span id="winTime">00:00</span></p>
          <p>步数：<span id="winMoves">0</span></p>
          <p>难度：<span id="winDifficulty">3×3</span></p>
        </div>
        <div class="celebration">
          <span class="star">⭐</span>
          <span class="star">⭐</span>
          <span class="star">⭐</span>
        </div>
        <button id="playAgainBtn">再玩一次</button>
      </div>
    </div>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
